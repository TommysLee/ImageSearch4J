#服务器配置（仅在SpringBoot内有效，外部Tomcat等容器无效）
server:
  port: 80 #服务器HTTP端口
  servlet:
    encoding:
      charset: UTF-8

#Spring配置
spring:
  mvc:
    async:
      request-timeout: 5000 #全局异步请求超时：5秒，避免请求无限挂起
  thymeleaf: #视图配置
    cache: false #开发时，关闭thymeleaf缓存
  jackson: #JSON配置
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_EMPTY
  servlet:
    multipart: #文件上传配置（单文件大小限制与请求总大小限制）
      max-file-size: 10MB
      max-request-size: 25MB

#项目配置
ty:
  #模型配置
  onnx-engine-path: "${user.home}/.djl.ai/onnx/win-x64"
  models-dir: "${user.home}/models"
  main-body-model-name: "picodet_lcnet_x2_5_640_mainbody.onnx"
  general-p-pLCNet-model-name: "general_PPLCNetV2.onnx"
  #AI推理任务线程池配置
  ai-infer:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100
    keep-alive-seconds: 60
    thread-name-prefix: ai-infer-
  #Predictor 对象池配置
  predictor:
    max-total: 8
    max-idle: 8
    min-idle: 2
    block-when-exhausted: true
    max-wait: 1
    test-on-borrow: false
    test-on-return: false
    time-between-eviction-runs: 30
    min-evictable-idle-time: 300
